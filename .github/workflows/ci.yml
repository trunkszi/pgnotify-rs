name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGNOTIFY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt, rust-src
          targets: x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without optional adapters
        run: cargo clippy -p pgnotify --no-default-features --all-targets --locked -- -D warnings
      - name: Clippy with JSON codecs only
        run: cargo clippy -p pgnotify --no-default-features --features sonic --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test core
        run: cargo test -p pgnotify --no-default-features --locked
      - name: Test JSON codecs without adapters
        run: cargo test -p pgnotify --no-default-features --features sonic --locked
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
