[workspace]
members = ["crates/pgnotify", "crates/pgnotify-macros", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pq-sys = { version = "=0.7.6", default-features = false, features = ["bundled_without_openssl"] }
diesel = { version = "=2.3.14", default-features = false, features = ["postgres", "r2d2", "32-column-tables"] }
sonic-rs = { version = "0.5", default-features = false }
liburing-proactor = { version = "=0.0.1", default-features = false }
thiserror = { version = "2", default-features = false }
libc = { version = "0.2", default-features = false }
bitflags = { version = "2", default-features = false }

pgnotify-macros = { path = "crates/pgnotify-macros", version = "0.1.0" }
proc-macro2 = { version = "1", default-features = false, features = ["proc-macro"] }
quote = { version = "1", default-features = false, features = ["proc-macro"] }
syn = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
trybuild = { version = "1", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
hdrhistogram = { version = "7", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
clone_on_copy = "deny"
redundant_clone = "deny"

[profile.release]
panic = "abort"
lto = "thin"

[profile.bench]
debug = "full"
strip = "none"
